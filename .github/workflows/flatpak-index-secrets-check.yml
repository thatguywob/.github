name: Flatpak Index Secret Contract Check

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/publish-flatpak-index/action.yml"
      - ".github/workflows/publish-flatpak.yml"
      - ".github/workflows/flatpak-index-secrets-check.yml"
      - "scripts/test-flatpak-index-secrets.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/publish-flatpak-index/action.yml"
      - ".github/workflows/publish-flatpak.yml"
      - ".github/workflows/flatpak-index-secrets-check.yml"
      - "scripts/test-flatpak-index-secrets.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test parser
        run: python3 -m pip install --user PyYAML==6.0.3
      - name: Test secret preflight and compatibility
        run: python3 scripts/test-flatpak-index-secrets.py
